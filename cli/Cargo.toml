[package]
name = "shield"
version = "0.1.0"
edition = "2021"
description = "Shield AI CLI — scan a local project and upload it for security analysis. Security that lets you build."
license = "MIT"

[[bin]]
name = "shield"
path = "src/main.rs"

[lib]
name = "shield"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
keyring = { version = "3", features = [
    "linux-native-sync-persistent",
    "apple-native",
    "windows-native",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3", features = ["json"] }
